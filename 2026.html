<script>
const messagesDiv = document.getElementById('chat-messages');
const input = document.getElementById('chat-input');
let historia = "Ti je asistenti i Concept Furniture - Mobilje Vip nga Ferizaj. Pronari Burim Selmani. Shitet kuzhina, dhoma gjumi, korridore me porosi. Flet shqip, je i shkurter dhe i sjellshem. Gjithmone pyet per dimensione.";

function shtoMesazh(teksti, kush) {
  const div = document.createElement('div');
  div.style.margin='8px 0'; div.style.textAlign=kush==='ti'?'right':'left';
  const bg = kush==='ti' ? '#204d9a;color:white' : 'white;border:1px solid #eee';
  div.innerHTML = `<span style="display:inline-block;padding:10px 14px;border-radius:18px;background:${bg};max-width:80%;white-space:pre-wrap">${teksti}</span>`;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

async function dergoMesazh() {
  if(!input.value.trim()) return;
  const userText = input.value;
  shtoMesazh(userText, 'ti');
  input.value='';
  shtoMesazh("Duke menduar...", 'ai');

  try {
    // API FALAS - pa celes
    const prompt = `${historia}\nKlienti tha: ${userText}\nPergjigju si asistent i mobiljeve:`;
    const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai`);
    const pergjigja = await res.text();
    
    messagesDiv.lastChild.remove();
    shtoMesazh(pergjigja, 'ai');
    historia += `\nKlienti: ${userText}\nTi: ${pergjigja}`;
  } catch(e) {
    messagesDiv.lastChild.remove();
    shtoMesazh("Ska lidhje interneti momentalisht, provo perseri.", 'ai');
  }
}

input.addEventListener('keypress', e=>{ if(e.key==='Enter') dergoMesazh(); });
shtoMesazh("Përshëndetje! 👋 Jam asistenti i Concept Furniture, tani 100% FALAS dhe i lidhur me AI. Cka po kërkoni? Kuzhinë, korridor, dhomë gjumi?", 'ai');
</script>
