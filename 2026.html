<script>
const messages = document.getElementById('chat-messages');
const history = [];

function shtoMesazh(teksti, kush) {
  const div = document.createElement('div');
  div.style.margin = '8px 0';
  div.style.textAlign = kush==='ti' ? 'right' : 'left';
  const bg = kush==='ti' ? '#204d9a;color:white' : 'white;border:1px solid #eee';
  div.innerHTML = `<span style="display:inline-block;padding:10px 14px;border-radius:18px;background:${bg};max-width:80%;word-wrap:break-word">${teksti}</span>`;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function merrPergjigje(userText) {
  const t = userText.toLowerCase();
  if(t.includes('korridor')) return "Korridoret i bejme me porosi, me dyer rreshqitese. Gjeresia sa e ke? Te dergoj 3 modele qe i kemi bere kete jave. Deshiron me i pa ne WhatsApp?";
  if(t.includes('kuzhin')) return "Kuzhinat koncept i kemi super. MDF i lyer, me mentesha Blum. Cmimi fillon nga 1200€ per meter. Sa metra e ke kuzhinen?";
  if(t.includes('dhom') || t.includes('gjumi')) return "Dhomat e gjumit: Shtrat + 2 komodina + dollap rreshqites. Nga 650€ kompleti. E ke modelin modern apo klasik ne mendje?";
  if(t.includes('cmim') || t.includes('qmime') || t.includes('sa kushton')) return "Cmimet varen nga materiali dhe dimensionet. Me thuaj cka te duhet sakte dhe ta jap cmimin fiks tani.";
  if(t.includes('nr') || t.includes('tel') || t.includes('whatsapp') || t.includes('viber')) return "Numri im direkt eshte +383 44 ... - me shkruaj ne WhatsApp dhe ta dergoj katalogun menjehere!";
  if(t.includes('persh') || t.includes('hi') || t.includes('hej')) return "Pershendetje perseri! 😊 Me thuaj, per cfare mobilje je i interesuar?";
  return "Kuptova: '"+userText+"'. Mund te me thuash pak me shume detaje? Psh dimensionet ose ngjyra qe deshiron, dhe te ndihmoj me ide dhe cmim.";
}

function dergoMesazh() {
  const input = document.getElementById('chat-input');
  if(!input.value.trim()) return;
  const text = input.value;
  shtoMesazh(text, 'ti');
  history.push(text);
  input.value='';
  
  setTimeout(()=>{
    const pergjigja = merrPergjigje(text);
    shtoMesazh(pergjigja, 'ai');
  }, 600);
}

// enter me tastiere
document.getElementById('chat-input').addEventListener('keypress', function(e){
  if(e.key==='Enter') dergoMesazh();
});

shtoMesazh("Përshëndetje! 👋 Jam asistenti i Concept Furniture. Si mund t'ju ndihmoj?", 'ai');
</script>
