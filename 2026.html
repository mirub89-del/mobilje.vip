<html lang="sq"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concept Furniture - Mobilje Vip</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background: linear-gradient(180deg, #1e4a9a 0%, #172d6e 100%);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    padding:20px;
  }
  .card{
    background:white;
    width:100%;
    max-width:420px;
    border-radius:32px;
    padding:32px 24px 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .logo{
    text-align:center;
    color:#204d9a;
    font-size:13px;
    letter-spacing:4px;
    font-weight:600;
    margin-bottom:24px;
    text-transform:lowercase;
  }
  .title{
    text-align:center;
    font-size:22px;
    font-weight:800;
    line-height:1.3;
    margin-bottom:24px;
    color:#111;
  }
  #chat-messages{
    height:340px;
    overflow-y:auto;
    border:1px solid #eee;
    background:#fafafa;
    border-radius:16px;
    padding:12px;
    margin-bottom:12px;
  }
  .input-row{
    display:flex;
    gap:8px;
  }
  #chat-input{
    flex:1;
    padding:14px 18px;
    border-radius:24px;
    border:1px solid #ddd;
    outline:none;
    font-size:16px;
  }
  #chat-input:focus{border-color:#204d9a}
  .btn{
    padding:14px 22px;
    border-radius:24px;
    border:none;
    background:#204d9a;
    color:white;
    font-weight:700;
    cursor:pointer;
  }
  .btn:active{transform:scale(0.97)}
  .footer{
    margin-top:40px;
    color:rgba(255,255,255,0.8);
    font-size:12px;
    text-align:center;
  }
  .footer b{color:white;text-decoration:underline}
</style>
</head>
<body>

<div class="card">
  <div class="logo">concept furniture</div>
  <div class="title">Mirë se vini në<br>Concept Furniture</div>

  <div id="chat-messages"><div style="margin: 8px 0px; text-align: left;"><span style="display:inline-block;padding:10px 14px;border-radius:18px;background:white;border:1px solid #e5e5e5;color:#111;max-width:85%;word-wrap:break-word;white-space:pre-wrap;font-size:14.5px;line-height:1.4">Përshëndetje! 👋 Jam asistenti i Concept Furniture. Si mund t'ju ndihmoj? Kemi kuzhina, dhoma gjumi, korridore me porosi.</span></div></div>

  <div class="input-row">
    <input id="chat-input" type="text" placeholder="Shkruaj: kuzhinë, dhomë gjumi...">
    <button class="btn" onclick="dergoMesazh()">DËRGO</button>
  </div>
</div>

<div class="footer">all right reserved © 2018 <b>Burim Selmani</b></div>

<script>
const messagesDiv = document.getElementById('chat-messages');
const input = document.getElementById('chat-input');
let historia = "Ti je asistenti i Concept Furniture - Mobilje Vip nga Ferizaj, pronari Burim Selmani. Shitet kuzhina, dhoma gjumi, korridore me porosi, material MDF me mekanizma Blum. Flet shqip (geg, kosovar). Je i shkurter, i sjellshem. Pyet gjithmone per dimensione dhe ofro katalogun ne WhatsApp +383 44 604 372.";

function shtoMesazh(teksti, kush) {
  const div = document.createElement('div');
  div.style.margin='8px 0';
  div.style.textAlign = kush==='ti' ? 'right' : 'left';
  const style = kush==='ti' ? 'background:#204d9a;color:white' : 'background:white;border:1px solid #e5e5e5;color:#111';
  div.innerHTML = `<span style="display:inline-block;padding:10px 14px;border-radius:18px;${style};max-width:85%;word-wrap:break-word;white-space:pre-wrap;font-size:14.5px;line-height:1.4">${teksti}</span>`;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

async function dergoMesazh() {
  const text = input.value.trim();
  if(!text) return;
  shtoMesazh(text, 'ti');
  input.value='';
  
  const loading = document.createElement('div');
  loading.style.margin='8px 0';
  loading.innerHTML = `<span style="display:inline-block;padding:10px 14px;border-radius:18px;background:white;border:1px solid #e5e5e5;color:#888;font-size:13px">Duke shkruajtur...</span>`;
  messagesDiv.appendChild(loading);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;

  try {
    const prompt = `${historia}
Klienti pyet: ${text}
Pergjigju si asistent mobiljesh ne shqip, shkurte dhe ndihmues:`;
    const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai`, {cache: "no-store"});
    let pergjigja = await res.text();
    // pastro pergjigje te gjata
    if(pergjigja.length > 400) pergjigja = pergjigja.substring(0,400) + "...";
    messagesDiv.removeChild(loading);
    shtoMesazh(pergjigja, 'ai');
  } catch(e) {
    messagesDiv.removeChild(loading);
    shtoMesazh("Ka problem me lidhjen. Provo perseri, ose me shkruaj direkt ne WhatsApp +383 44 604 372", 'ai');
  }
}

input.addEventListener('keypress', (e)=>{ if(e.key==='Enter') dergoMesazh(); });

// mesazhi i pare
shtoMesazh("Përshëndetje! 👋 Jam asistenti i Concept Furniture. Si mund t'ju ndihmoj? Kemi kuzhina, dhoma gjumi, korridore me porosi.", 'ai');
</script>

ment(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script>

</body></html>
