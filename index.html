*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;

  align-items:center;

.card{
  background:#fff;
  width:100%;
  max-width:390px;
  border-radius:24px;
  padding:42px 32px;
  box-shadow:0 20px 60px rgba(0,0,0,0.35);
  text-align:center;
  animation:fadeIn .6s ease;

@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.label{font-size:11px;letter-spacing:2.5px;color:#0a4da1;font-weight:700;margin-bottom:14px}
h1{font-size:18px;font-weight:600;color:#1a1a1a;line-height:1.5;margin-bottom:28px}
input{width:100%;padding:16px 20px;font-size:22px;letter-spacing:6px;text-align:center;border:2px solid #e5e7eb;border-radius:12px;outline:none;transition:.2s;font-weight:600}
input:focus{border-color:#0a4da1;box-shadow:0 0 0 4px rgba(10,92,194,.12)}
input.error{border-color:#ef4444;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.btn{width:100%;padding:16px;background:#0a4da1;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:.2s;margin-top:18px}
.btn:hover{background:#083e8a;transform:translateY(-1px)}
#errorMsg{color:#ef4444;font-size:13px;margin-top:12px;display:none;font-weight:500}
.footer{position:fixed;bottom:22px;left:0;right:0;text-align:center;color:rgba(255,255,255,.85);font-size:13px}
.footer a{color:#fff;text-decoration:underline;text-underline-offset:3px;font-weight:600}
.footer a:hover{color:#a3c6ff}

<script>
const VALID_CODE = "rimcode";
const DEST_URL = "https://mobilje.vip/shija.html";
const input = document.getElementById('inviteInput');
const btn = document.getElementById('connectBtn');
const error = document.getElementById('errorMsg');

function checkCode(){
  const val = input.value.trim();
  if(val === VALID_CODE){
    error.style.display='none';
    btn.textContent='✓ QASJA U LEJUA';
    btn.style.background='#10b981';
    input.style.borderColor='#10b981';
    setTimeout(()=>{ window.location.href = DEST_URL; }, 700);
  } else {
    error.style.display='block';
    input.classList.add('error');
    input.value='';
    input.focus();
    setTimeout(()=>input.classList.remove('error'),400);
  }
}
btn.addEventListener('click', checkCode);
input.addEventListener('keydown', e=>{ if(e.key==='Enter') checkCode(); });
input.addEventListener('input', ()=>{ error.style.display='none'; });

// Footer link - burim selmani -> profile
document.addEventListener('DOMContentLoaded', ()=>{
  const el = document.getElementById('footerName');
  const d = "facebook.com";
  const u = "slburim";
  const p = "https://www.";
  const url = p + d + "/" + u;
  const a = document.createElement('a');
  a.textContent = 'Burim Selmani';
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener';
  el.replaceWith(a);
});
input.focus();
</script>
