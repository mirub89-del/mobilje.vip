<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyrje - Kodi i Ftesës</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(135deg,#0a5cc2 0%,#001e4a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif}
.card{background:#fff;max-width:380px;width:100%;border-radius:24px;padding:40px 32px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
input{width:100%;padding:16px;font-size:22px;letter-spacing:6px;text-align:center;border:2px solid #e5e7eb;border-radius:12px}
.btn{width:100%;padding:16px;margin-top:18px;background:#0a4da1;color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer}
.footer{position:fixed;bottom:20px;color:rgba(255,255,255,.8);font-size:13px}
.footer a{color:#fff;text-decoration:underline}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.error{animation:shake .4s;border-color:red !important}
</style>
</head>
<body>
<div class="card">
  <div style="font-size:11px;letter-spacing:2px;color:#0a4da1;font-weight:700;margin-bottom:12px">KODI I FTESËS</div>
  <h1 style="font-size:20px;margin-bottom:28px">Shkruaj kodin e ftesës për të vazhduar</h1>
  <input type="password" id="inviteInput" placeholder="••••••" maxlength="10">
  <button class="btn" id="connectBtn">LIDHU</button>
  <p id="errorMsg" style="display:none;color:red;font-size:13px;margin-top:12px">Kodi i gabuar! Provoni përsëri.</p>
</div>
<div class="footer">© 2018 <span id="footerName">burim selmani</span></div>

<script>
const VALID_CODE = "525317";
const DEST_URL = "https://mobilje.vip/shija.html";
const input=document.getElementById('inviteInput');
const btn=document.getElementById('connectBtn');
const error=document.getElementById('errorMsg');

function checkCode(){
  if(input.value.trim() === VALID_CODE){
    btn.textContent='✓ QASJA U LEJUA';
    setTimeout(()=>{window.location.href=DEST_URL},600);
  } else {
    error.style.display='block';
    input.classList.add('error');
    input.value='';
    setTimeout(()=>input.classList.remove('error'),400);
  }
}
btn.addEventListener('click',checkCode);
input.addEventListener('keydown',e=>{if(e.key==='Enter')checkCode()});

// Footer link - e fshehur qe te mos bllokohet
document.addEventListener('DOMContentLoaded',()=>{
  const el=document.getElementById('footerName');
  const url="https://www."+"facebook.com/"+"slburim";
  const a=document.createElement('a');
  a.textContent='burim selmani'; a.href=url; a.target='_blank';
  el.replaceWith(a);
});
</script>
</body>
</html>
